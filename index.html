<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honey Goes to Space</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="main-content">
      <div class="welcome-screen">
        <h1>Honey goes to space</h1>
        <p>
          This little one ended up on space, now she needs to scape the
          spaceships attacking her. To guide her use the following key words:
          arrow left Arrow right Arrow up to move forward Arrow down to move
          backwards
        </p>

        <button>Start the trip</button>
      </div>

      <div class="game-screen"></div>
      <div class="end-screen"></div>
    </section>
    <script src="./javascript/game.js"></script>
    <script src="./javascript/honey.js"></script>
    <script src="javascript/spaceships.js"></script>
  </body>
</html>
